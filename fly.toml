# Fly.io deploy config. Run `fly launch --no-deploy` to claim an app name,
# then create a volume and `fly deploy`. See README "Deploy".
app = "world-wide-canvas"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  WWC_DB_FILE = "/app/data/world.db"
  # In-memory chunk cap. 1024 ≈ 256 MB of chunk data, safe on a 512 MB VM.
  # Raise this if you also bump the VM memory below.
  WWC_MAX_CHUNKS = "1024"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"   # keep it always-on so the canvas is always live
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

# Persistent volume for the SQLite world. Create with:
#   fly volumes create world_data --size 1 --region iad
[mounts]
  source = "world_data"
  destination = "/app/data"

# 512 MB gives headroom for the in-memory world + Node under a launch spike.
# Drop to 256 MB (and WWC_MAX_CHUNKS ~512) to halve the cost if traffic is light.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
